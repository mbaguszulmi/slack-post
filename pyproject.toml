[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-post"
version = "0.1.0"
description = "Send Slack messages by reusing slackdump's stored credentials"
requires-python = ">=3.8"
dependencies = ["cryptography>=41"]

[project.scripts]
slack-post = "slackpost.__main__:main"

[tool.setuptools]
packages = ["slackpost"]
